services:
  postgres:
    image: postgres:16-alpine
    container_name: smartax_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smartax_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartax_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: smartax_db
      DB_SYNCHRONIZE: "true"
      FRONTEND_URL: "http://localhost:3000"
      ADMIN_EMAIL: "admin@smartaxglobal.com"
      ADMIN_PASSWORD: "Admin@SMARTax2025!"
      JWT_SECRET: "smartax-super-secret-jwt-key-change-in-production"
      JWT_EXPIRES_IN: "8h"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: 587
      SMTP_USER: "info@smartaxglobal.com"
      SMTP_PASS: "your-gmail-app-password-here"
      SMTP_FROM: "SMARTax Global <info@smartaxglobal.com>"
      NOTIFY_EMAIL: "info@smartaxglobal.com"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartax_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api"

volumes:
  postgres_data:
